<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Oshimai Record &amp; Replay</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #161616;
    --layer: #262626;
    --border: #393939;
    --text: #f4f4f4;
    --text-muted: #a8a8a8;
    --blue: #0f62fe;
    --green: #24a148;
    --red: #da1e28;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  body {
    margin: 0;
    width: 320px;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, sans-serif;
    font-size: 13px;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 2px 0 0;
  }
  main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--layer);
    border: 1px solid var(--border);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50% !important;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .dot.active { background: var(--red); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-text { flex: 1; }
  .count { color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  button {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 12px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 70ms cubic-bezier(0.2, 0, 0.38, 0.9);
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: #0353e9; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #ba1b23; }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: var(--layer); }
  .btn-secondary:disabled { color: var(--text-muted); cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > button { flex: 1; }
  label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  input[type="text"] {
    width: 100%;
    background: var(--layer);
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
  }
  input[type="text"]:focus { outline: 2px solid var(--blue); outline-offset: -2px; }
  #message { font-size: 11px; color: var(--text-muted); min-height: 14px; }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Oshimai</div>
  <h1>Record &amp; Replay</h1>
</header>
<main>
  <div class="status-row">
    <span id="dot" class="dot"></span>
    <span id="statusText" class="status-text">Idle</span>
    <span id="countText" class="count">0 req</span>
  </div>

  <div class="row">
    <button id="startBtn" class="btn-primary">Start Recording</button>
    <button id="stopBtn" class="btn-danger" style="display:none">Stop</button>
  </div>

  <div class="row">
    <button id="exportBtn" class="btn-secondary" disabled>Export HAR</button>
    <button id="clearBtn" class="btn-secondary" disabled>Clear</button>
  </div>

  <div>
    <label for="serverUrl">Oshimai server URL</label>
    <input id="serverUrl" type="text" placeholder="http://localhost:8080" />
  </div>
  <button id="sendBtn" class="btn-primary" disabled>Send to Oshimai</button>
  <div id="message"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
